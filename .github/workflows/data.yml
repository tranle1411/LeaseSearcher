name: Rebuild reviewed data artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: python -m pipeline.build --output reviewed-data/snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset
          path: reviewed-data/snapshot.json
